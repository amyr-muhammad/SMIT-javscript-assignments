<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>

  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body class="d-flex flex-column min-vh-100">

<!-- NAVBAR -->
<nav class="navbar navbar-expand-lg bg-danger">
  <div class="container">
    <a class="navbar-brand text-white">Assignments</a>

    <div class="ms-auto d-flex">
      <input class="form-control me-2" type="search" placeholder="Search">
      <button class="btn btn-outline-light">Search</button>
    </div>
  </div>
</nav>

<!-- HEADING -->
<div class="container text-center my-4">
  <h4>Chapter # 69 - 75 | Objects, Properties, Methods, Constructors, and Prototypes</h4>
</div>

<!-- MAIN SECTION -->
<div class="container">
  <div class="row g-4">

    <!-- BUTTONS -->
    <div class="col-md-6">
      <h5 class="text-center">Buttons</h5>
      <div class="border p-4 rounded text-center">

        <button class="btn btn-danger w-75 mb-2" onclick="showImage()">
          Show Image
        </button>

        <button class="btn btn-danger w-75 mb-2" onclick="showTable()">
          Show Table
        </button>

        <button class="btn btn-danger w-75" onclick="printUsers()">
          Print Users in Console
        </button>

      </div>
    </div>

    <!-- FORM -->
    <div class="col-md-6">
      <h5 class="text-center">Form</h5>
      <div class="border p-4 rounded">

        <div class="row g-2">
          <div class="col">
            <input type="text" class="form-control" id="firstName" placeholder="First Name">
          </div>
          <div class="col">
            <input type="text" class="form-control" id="lastName" placeholder="Last Name">
          </div>
        </div>

        <div class="row g-2 mt-2">
          <div class="col">
            <input type="email" class="form-control" id="email" placeholder="Email">
          </div>
          <div class="col">
            <input type="date" class="form-control" id="date">
          </div>
        </div>

        <div class="text-center mt-3">
          <button class="btn btn-success w-50" onclick="addUser()">Add User</button>
        </div>

      </div>
    </div>

  </div>

  <!-- OUTPUT -->
  <div class="row mt-4 mb-4">
    <div class="col">
      <h5 class="text-center">Output / Result</h5>
      <div id="output" class="border p-4 rounded bg-light" style="min-height:150px;"></div>

      <div class="text-center mt-2">
        <button class="btn btn-outline-secondary" onclick="clearOutput()">Clear Output</button>
      </div>
    </div>
  </div>
</div>

<!-- FOOTER -->
<footer class="mt-auto bg-danger text-white text-center py-2 mt-5">
