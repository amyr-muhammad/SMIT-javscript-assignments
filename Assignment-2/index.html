<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>JavaScript Assigment 2</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
      rel="stylesheet"
      integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB"
      crossorigin="anonymous"
    />
  </head>
  <body>
    <header>
      <nav class="navbar navbar-expand-lg bg-danger">
        <div class="container">
          <a class="navbar-brand text-white" href="#">Assingments</a>
          <button
            class="navbar-toggler"
            type="button"
            data-bs-toggle="collapse"
            data-bs-target="#navbarSupportedContent"
            aria-controls="navbarSupportedContent"
            aria-expanded="false"
            aria-label="Toggle navigation"
          >
            <span class="navbar-toggler-icon"></span>
          </button>
          <div class="collapse navbar-collapse" id="navbarSupportedContent">
            <ul class="navbar-nav me-auto mb-2 mb-lg-0">
              <li class="nav-item">
                <a
                  class="nav-link text-white"
                  aria-current="page"
                  href="#"
                  id="alink"
                  >Chapter 8-14</a
                >
              </li>
            </ul>
            <form class="d-flex" role="search">
              <input
                class="form-control me-2 focus-ring focus-ring-danger border-danger"
                type="search"
                placeholder="Search"
                aria-label="Search"
              />
              <button class="btn btn-outline-light" type="submit">
                Search
              </button>
            </form>
          </div>
        </div>
      </nav>
    </header>

    <main>
      <div class="container">
        <div class="row">
          <div class="col">
            <h4
              class="text-center mt-5 border-bottom border-danger pb-3 text-danger"
            >
              Chapter # 8-14 | Concantation | Prompts | if..else and else if
              statements
            </h4>
          </div>
        </div>
      </div>

      <div class="container my-4">
        <div
          class="row d-flex flex-wrap justify-content-center gap-1 border border-danger rounded gx-0 p-4"
        >
          <div class="col-auto">
            <button class="btn btn-danger btn-sm" id="concatenate">
              Concatenate Some Strings
            </button>
          </div>
          <div class="col-auto">
            <button class="btn btn-danger btn-sm" id="name">Ask Name From User</button>
          </div>
          <div class="col-auto">
            <button class="btn btn-danger btn-sm" id="operators">Comparison Operators</button>
          </div>
          <div class="col-auto">
            <button class="btn btn-danger btn-sm" id="ifElseIf">if else if</button>
          </div>
          <div class="col-auto">
            <button class="btn btn-danger btn-sm" id="testingSets">
              Testing Sets of Conditions
            </button>
          </div>
          <div class="col-auto">
            <button class="btn btn-danger btn-sm" id="nested">if Statements Nested</button>
          </div>
          <div class="col-auto">
            <button class="btn btn-danger btn-sm" id="login">Login</button>
          </div>
        </div>
      </div>

      <div class="container mt-5">
        <div class="row">
          <div class="col">
            <h4 class="text-center text-danger">
              Original Statement
            </h4>
          </div>
        </div>
        <div class="row">
          <div class="col mt-3">
            <p class="border border-danger rounded w-100 p-3 mt-1" id="original"></p>
          </div>
        </div>

        <div class="row">
          <div class="col text-center mt-3">
            <button class="btn btn-outline-danger" id="clearStatement">
              Clear Statements
            </button>
          </div>
        </div>
      </div>

      <div class="container mt-5">
        <div class="row">
          <div class="col">
            <h4 class="text-center text-danger">Output/Results</h4>
          </div>
        </div>
        <div class="row">
          <div class="col mt-3">
            <p class="border border-danger rounded w-100 p-3 mt-1" id="output"></p>
          </div>
        </div>

        <div class="row">
          <div class="col text-center mt-3">
            <button class="btn btn-outline-danger" id="clearOutput">
              Clear Output
            </button>
          </div>
        </div>
      </div>
    </main>

    <footer>
      <div class="container-fluid bg-danger mt-4">
        <div class="row">
          <div class="col">
            <p class="text-white text-center mb-0 py-2">&copy;2026, Assingment By Umair Ahmed</p>
          </div>
        </div>
      </div>
    </footer>

    <script
      src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
      integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
      crossorigin="anonymous"
    ></script>
    <script src="script.js"></script>
  </body>
</html>
