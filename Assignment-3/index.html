<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>JavaScript Assigment 3</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
      rel="stylesheet"
      integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB"
      crossorigin="anonymous"
    />
  </head>
  <body class="d-flex flex-column min-vh-100">
    <header>
      <nav class="navbar navbar-expand-lg bg-danger">
        <div class="container">
          <a class="navbar-brand text-white" href="#">Assingments</a>
          <button
            class="navbar-toggler"
            type="button"
            data-bs-toggle="collapse"
            data-bs-target="#navbarSupportedContent"
            aria-controls="navbarSupportedContent"
            aria-expanded="false"
            aria-label="Toggle navigation"
          >
            <span class="navbar-toggler-icon"></span>
          </button>
          <div class="collapse navbar-collapse" id="navbarSupportedContent">
            <ul class="navbar-nav me-auto mb-2 mb-lg-0">
              <li class="nav-item">
                <a
                  class="nav-link text-white"
                  aria-current="page"
                  href="#"
                  id="alink"
                  >Chapter 15-20</a
                >
              </li>
            </ul>
            <form class="d-flex" role="search">
              <input
                class="form-control me-2 focus-ring focus-ring-danger border-danger"
                type="search"
                placeholder="Search"
                aria-label="Search"
              />
              <button class="btn btn-outline-light" type="submit">
                Search
              </button>
            </form>
          </div>
        </div>
      </nav>
    </header>

    <main class="flex-grow-1">
      <div class="container">
        <div class="row">
          <div class="col">
            <h4
              class="text-danger text-center border-bottom border-danger pb-2 my-5"
            >
              Chapter # 15-20 | Arrays: It's Methods & for Loop
            </h4>
          </div>
        </div>
      </div>

      <div class="container">
        <div class="row">
          <div class="col-12 col-lg-6">
            <h5 class="text-center">Input</h5>
            <form
              action=""
              class="d-flex border border-black p-4 h-100 rounded"
            >
              <input
                type="text"
                class="form-control rounded-0 rounded-start h-75"
                placeholder="Type your text here" id="userName"
              />
              <button
                class="btn btn-outline-secondary rounded-0 rounded-end h-75" onclick="clearInputField()"
              >
                Clear
              </button>
            </form>
          </div>

          <div class="col-12 col-lg-6">
            <h5 class="text-center">Original String</h5>
            <div class="d-flex p-4 bg-danger h-100 rounded">
              <p class="text-white" id="original"></p>
            </div>
          </div>
        </div>
      </div>

      <div class="container mt-5">
        <div class="row">
          <div class="col-12 col-lg-6">
            <h5 class="text-center">Buttons</h5>
            <div class="border border-black p-5 h-75 rounded">
              <div class="row g-2 justify-content-center">
                <div class="col-6">
                  <button class="btn btn-danger w-100" onclick="simpleAlert()" >Simple Alert</button>
                </div>
                <div class="col-6">
                  <button class="btn btn-danger w-100" onclick="printUserName()">Print My Name</button>
                </div>
                <div class="col-6">
                  <button class="btn btn-danger w-100" onclick="printAllCities()">Print All cities</button>
                </div>
                <div class="col-6">
                  <button class="btn btn-danger w-100" onclick="addCity()">
                    Add Your City in List
                  </button>
                </div>
                <div class="col-6">
                  <button class="btn btn-danger w-100" onclick="genTable()">Generate Table</button>
                </div>
              </div>
            </div>
          </div>

          <div class="col-12 col-lg-6 text-center">
            <h5 class="text-center">Output/Results</h5>
            <div
              class="d-flex p-4 bg-body-secondary border border-black h-75 rounded"
            >
              <p id="output" ></p>
            </div>
           <button class="btn btn-outline-danger mt-2" onclick="clearOutput()">Clear Output</button>

          </div>
        </div>
      </div>
    </main>

    <footer>
      <div class="container-fluid mt-5">
        <div class="row">
          <div class="col bg-danger">
            <p class="mb-0 text-center py-2 text-white">
              &copy;2026, Assingment By Umair Ahmad
            </p>
          </div>
        </div>
      </div>
    </footer>

    <script
      src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
      integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
      crossorigin="anonymous"
    ></script>
    <script src="script.js"></script>
  </body>
</html>
