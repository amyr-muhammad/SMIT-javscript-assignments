<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>JavaScript Assingment 1</title>
     <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
      rel="stylesheet"
      integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB"
      crossorigin="anonymous"
    /> 
    
  </head>
  <body class="d-flex flex-column min-vh-100">
    <header>
      <nav class="navbar navbar-expand-lg bg-danger">
        <div class="container">
          <a class="navbar-brand text-white" href="#">Assingments</a>
          <button
            class="navbar-toggler"
            type="button"
            data-bs-toggle="collapse"
            data-bs-target="#navbarSupportedContent"
            aria-controls="navbarSupportedContent"
            aria-expanded="false"
            aria-label="Toggle navigation"
          >
            <span class="navbar-toggler-icon"></span>
          </button>
          <div class="collapse navbar-collapse" id="navbarSupportedContent">
            <ul class="navbar-nav me-auto mb-2 mb-lg-0">
              <li class="nav-item">
                <a class="nav-link text-white" aria-current="page" href="#"
                  >Chapter 1-7</a
                >
              </li>
            </ul>
            <form class="d-flex" role="search">
              <input
                class="form-control me-2 focus-ring focus-ring-danger border-danger"
                type="search"
                placeholder="Search"
                aria-label="Search"
              />
              <button class="btn btn-outline-light" type="submit">
                Search
              </button>
            </form>
          </div>
        </div>
      </nav>
    </header>
    <main class="flex-grow">
      <div class="container">
        <div class="row">
          <div class="col">
            <h4 class="text-center mt-5 border-bottom border-danger pb-3 text-danger">
              Chapter # 1-7 | Introduction to JavaScript | Data Types | Alert |
              Arithmetic Operators
            </h4>
          </div>
        </div>
      </div>

      <div class="container my-4">
        <div
          class="row d-flex flex-wrap justify-content-center gap-1 border border-danger rounded p-4 gx-0"
        >
          <div class="col-auto">
            <button class="btn btn-danger btn-sm" id="btn" >Alert Name</button>
          </div>
          <div class="col-auto">
            <button class="btn btn-danger btn-sm" id="num">Alert Number</button>
          </div>
          <div class="col-auto">
            <button class="btn btn-danger btn-sm" id="variable">Show Variable Names</button>
          </div>
          <div class="col-auto">
            <button class="btn btn-danger btn-sm " id="camelcase">
              Show camelCase Examples
            </button>
          </div>
          <div class="col-auto">
            <button class="btn btn-danger btn-sm" id="sum">Sum 2 Numbers</button>
          </div>
          <div class="col-auto">
            <button class="btn btn-danger btn-sm" id="substract">Substract 2 Numbers</button>
          </div>
          <div class="col-auto">
            <button class="btn btn-danger btn-sm" id="multiply">Multiply 2 Numbers</button>
          </div>
          <div class="col-auto">
            <button class="btn btn-danger btn-sm" id="divide">Divide 2 Numbers</button>
          </div>
          <div class="col-auto">
            <button class="btn btn-danger btn-sm" id="someNumber">
              Calculate Some Numbers
            </button>
          </div>
        </div>
      </div>

      <div class="container mt-5">
        <div class="row">
          <div class="col">
            <h4 class="text-center text-danger">Original Statements</h4>
          </div>
        </div>
        <div class="row">
          <div class="col mt-3">
            <p class="border border-1 border-danger w-100 rounded p-3 " id="statement"></p>
          </div>
        </div>
        <div class="row">
            <div class="col text-center mt-3">
                <button class="btn btn-outline-danger" id="clear">Clear Statement</button>
            </div>
        </div>
      </div>

      <div class="container mt-5 pt-5">
        <div class="row mt-3">
          <div class="col">
            <h4 class="text-center text-danger">Output/Results</h4>
          </div>
        </div>
        <div class="row">
          <div class="col mt-3">
            <p class="border border-1 border-danger w-100 rounded ps-3 py-3" id="output"></p>
          </div>
        </div>
        <div class="row">
            <div class="col text-center mt-3">
                <button class="btn btn-outline-danger m-auto" id="clearOutput">Clear Output</button>
            </div>
        </div>
      </div>
    
    </main>
    <footer class="bg-danger mt-5">
        <p class="text-white text-center py-2 mb-0">&copy;2026, Assingment by Umair Ahmed</p>
    </footer>
     <script
      src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
      integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
      crossorigin="anonymous"
    ></script> 
    <script src="script.js"></script>
  </body>
</html>
